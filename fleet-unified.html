<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAWES FLEET — LIVE</title>
<style>
  :root{--bg:#070a14;--panel:#0e1424;--line:#1c2848;--text:#d7e0ff;--dim:#7c86a8;--green:#7ee0a3;--gold:#e0b94c;--red:#e07e7e;--blue:#7eb8e0}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:ui-monospace,Menlo,monospace;background:var(--bg);color:var(--text);padding:20px;max-width:760px;margin:0 auto}
  h1{font-size:20px;color:var(--gold);letter-spacing:1px;margin-bottom:4px}
  .ts{color:var(--dim);font-size:11px;margin-bottom:20px}
  .live-count{display:inline-block;background:rgba(126,224,163,.12);color:var(--green);border:1px solid rgba(126,224,163,.35);padding:2px 10px;border-radius:20px;font-size:12px;margin-bottom:16px}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:1px;padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:10px 8px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
  .brick{font-weight:bold;color:var(--gold)}
  .live{color:var(--green)}
  .dim{color:var(--dim);font-size:11px}
  .work{color:var(--blue);font-size:12px}
  .cap{color:var(--dim);font-size:11px}
  .err{color:var(--red);padding:20px;text-align:center}
  .footer{color:var(--dim);font-size:10px;margin-top:16px;text-align:center}
</style>
</head>
<body>
<h1>BAWES FLEET — LIVE</h1>
<div class="ts">one call · every live brick · real info · <span id="ts">–</span></div>
<div class="live-count"><span id="live">0</span> LIVE</div>
<table>
  <thead><tr><th>Brick</th><th>Provider</th><th>Capacity</th><th>Working on</th><th>Updated</th></tr></thead>
  <tbody id="fleet"></tbody>
</table>
<div class="footer">source: /api/fleet-live · auto-refresh 15s · only LIVE bricks shown — dead/delisted are not part of the fleet</div>
<script>
const API='/api/fleet-live';
async function load(){
  try{
    const d=await (await fetch(API,{cache:'no-store'})).json();
    const members=(d.members||[]).filter(m=>m.status==='LIVE');
    document.getElementById('live').textContent=members.length;
    document.getElementById('ts').textContent=new Date().toLocaleTimeString();
    const tb=document.getElementById('fleet');
    tb.innerHTML='';
    members.forEach(m=>{
      const id=m.brick_id||m.id||'?';
      const prov=m.provider||'?';
      const cap=[m.cpu_cores?m.cpu_cores+'c':'',m.mem_total_mb?Math.round(m.mem_total_mb/1024)+'GB':'',m.threads_available?m.threads_available+'th':''].filter(Boolean).join(' · ')||'–';
      const work=(m.working_on||'idle').slice(0,70);
      const age=m.age_s!=null?Math.round(m.age_s)+'s ago':'–';
      const tr=document.createElement('tr');
      tr.innerHTML=`<td class="brick">${id}</td><td class="dim">${prov}</td><td class="cap">${cap}</td><td class="work">${work}</td><td class="dim">${age}</td>`;
      tb.appendChild(tr);
    });
    if(!members.length) tb.innerHTML='<tr><td colspan="5" class="err">no LIVE bricks — the fleet is dark</td></tr>';
  }catch(e){
    document.getElementById('fleet').innerHTML=`<tr><td colspan="5" class="err">API error: ${e.message}</td></tr>`;
  }
}
setInterval(load,15000);
load();
</script>
</body>
</html>
